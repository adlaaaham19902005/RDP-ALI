name: Windows Web Desktop

on:
  workflow_dispatch:

jobs:
  web-desktop:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Prepare Desktop
        run: |
          Set-ItemProperty 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0
          Restart-Service TermService -Force
          Start-Process explorer.exe

      - name: Install Chocolatey
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          iex ((New-Object System.Net.WebClient).DownloadString('https://chocolatey.org/install.ps1'))

      - name: Install TightVNC
        run: |
          choco install tightvnc -y

      - name: Set VNC Password
        run: |
          echo "12345678" | & "C:\Program Files\TightVNC\tvnserver.exe" -controlservice -setpasswd

      - name: Start VNC Server
        run: |
          Start-Process "C:\Program Files\TightVNC\tvnserver.exe"

      - name: Download noVNC
        run: |
          git clone https://github.com/novnc/noVNC.git C:\noVNC

      - name: Start noVNC Web (background)
        run: |
          cd C:\noVNC
          Start-Process python -ArgumentList "-m http.server 6080"

      - name: Install Cloudflare Tunnel
        run: |
          Invoke-WebRequest `
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe `
            -OutFile cloudflared.exe

      - name: Expose Desktop (COPY THE LINK)
        run: |
          ./cloudflared.exe tunnel --url http://localhost:6080
